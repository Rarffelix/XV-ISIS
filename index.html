<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quinceañera – Izis (Rosa Palo y Oro)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Belleza&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
  
  <style>
    /* PALETA DE COLORES CORREGIDA: Predominio Rosa Palo + Acentos de Oro */
    :root {
      /* Base Rosa Palo */
      --rose-bg-light: #fdf3f5; /* Fondo de la página (Rosa Palo muy claro) */
      --rose-card:     #fce8ed; /* Fondo de tarjetas (Rosa Palo suave) */
      --rose-main:     #f2c4ce; /* Rosa Palo Principal */
      --rose-dark:     #e8a0b0; /* Rosa Palo Medio */
      --rose-deep:     #c97f93; /* Rosa Palo Oscuro para texto importante */
      
      /* Acentos Dorados */
      --gold:          #d4a96a; /* Oro Base */
      --gold-deep:     #b68d4a; /* Oro Profundo */
      --gold-text:     #a67c3a; /* Oro para Texto y Acentos finos */
      
      /* Texto */
      --text:          #5a3a42; /* Texto Principal (marrón rosado oscuro) */
      --text-light:    #9b7080; /* Texto Secundario */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Jost', sans-serif;
      background-color: var(--rose-bg-light);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── DECORATIVE SVG PETALS (Rosa Palo) ── */
    .petals-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: .4;
    }
    .petals-bg svg { width: 100%; height: 100%; }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 80px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   #fce4ec 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 20% 100%, #fce4ec 0%, transparent 60%),
        var(--rose-bg-light);
      z-index: 1;
      border-bottom: 2px solid var(--gold-deep);
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, var(--gold) .5px, transparent .5px);
      background-size: 50px 50px;
      opacity: .08;
    }

    .crown {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: .3em;
      color: var(--gold);
      animation: fadeDown .9s ease both;
      margin-bottom: 6px;
    }

    .hero-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(.65rem, 2vw, .8rem);
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--rose-deep);
      animation: fadeDown 1s .15s ease both;
    }

    /* Nombre estilo Sephora */
    .hero-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.2;
      color: var(--rose-deep);
      text-shadow: 1px 1px 10px rgba(182,141,74,0.15);
      animation: fadeDown 1s .3s ease both;
      margin: 20px 0 10px;
    }

    /* Subtítulo estilo Hayden */
    .hero-XV {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 5vw, 2.5rem);
      color: var(--gold-deep);
      letter-spacing: .25em;
      animation: fadeDown 1s .45s ease both;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 30px auto 0;
      width: min(320px, 80%);
      animation: fadeUp 1s .6s ease both;
    }
    .hero-divider span { flex: 1; height: 1px; background: var(--gold-deep); opacity: .6; }
    .hero-divider i { color: var(--gold-deep); font-size: 1rem; }

    .hero-date-preview {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      font-weight: 400;
      color: var(--gold-text);
      letter-spacing: .2em;
      margin-top: 18px;
      animation: fadeUp 1s .75s ease both;
    }

    .scroll-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: bounceDown 2s 1.5s infinite;
      color: var(--gold-text);
      font-size: .65rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      font-weight: 300;
    }
    .scroll-hint::after {
      content: '';
      display: block;
      width: 1px;
      height: 40px;
      background: var(--gold-text);
      opacity: .7;
    }

    /* ── SECTIONS WRAPPER ── */
    .sections { position: relative; z-index: 1; }

    /* ── SECTION BASE ── */
    section {
      padding: clamp(70px, 12vw, 120px) 24px;
      max-width: 860px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity .8s ease, transform .8s ease;
    }
    section.visible { opacity: 1; transform: none; }

    .section-tag {
      font-size: .65rem;
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--rose-deep);
      font-weight: 400;
      display: block;
      text-align: center;
      margin-bottom: 12px;
    }

    h2 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold-text);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .gold-line {
      display: block;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
      margin: 0 auto 40px;
    }

    /* ── MESSAGE ── */
    .message-card {
      background-color: var(--rose-card);
      border: 1px solid rgba(212, 169, 106, 0.3);
      border-radius: 8px;
      padding: clamp(36px, 8vw, 64px) clamp(28px, 10vw, 80px);
      text-align: center;
      position: relative;
      box-shadow: 0 12px 48px rgba(201, 127, 147, 0.15);
    }
    .message-card::before,
    .message-card::after {
      content: '❀';
      position: absolute;
      color: rgba(212, 169, 106, 0.3);
      font-size: clamp(4rem, 10vw, 6rem);
      line-height: 1;
    }
    .message-card::before { top: -20px; left: 20px; }
    .message-card::after  { bottom: -20px; right: 20px; transform: rotate(180deg); }

    .message-card p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3.2vw, 1.35rem);
      line-height: 1.9;
      color: var(--text);
      font-weight: 400;
    }
    .message-card .signature {
      margin-top: 28px;
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      letter-spacing: 0.1em;
      color: var(--gold-text);
    }

    /* ── DETAILS ── */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 28px;
      margin-bottom: 48px;
    }

    .detail-card {
      background-color: var(--rose-card);
      border: 1px solid rgba(212, 169, 106, 0.3);
      border-radius: 8px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 6px 28px rgba(201, 127, 147, 0.1);
      transition: transform .3s ease, box-shadow .3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .detail-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(201, 127, 147, 0.2);
    }

    .detail-icon {
      font-size: 2.2rem;
      margin-bottom: 16px;
      display: block;
      color: var(--gold);
    }

    .detail-card h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: .65rem;
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--gold-text);
      margin-bottom: 12px;
    }

    .detail-card .value {
      font-family: 'Cinzel', serif;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
    }

    .detail-card .sub {
      font-family: 'Montserrat', sans-serif;
      font-size: .8rem;
      color: var(--gold-text);
      margin-top: 6px;
      font-weight: 300;
    }

    /* Botón interno para mapa GPS */
    .btn-mapa {
      display: inline-block;
      margin-top: 15px;
      font-size: 0.75rem;
      color: var(--gold-text);
      text-decoration: none;
      border: 1px solid var(--gold);
      padding: 6px 16px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-mapa:hover {
      background-color: var(--gold);
      color: white;
    }

    /* ── BOTÓN DE CONFIRMACIÓN GRADIENTE DORADO ── */
    .confirmar-container {
      text-align: center;
      margin-top: 30px;
    }

    .btn-confirmar {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-deep) 100%);
      color: #fff;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(182, 141, 74, 0.3);
      border: 1px solid var(--gold-deep);
    }

    .btn-confirmar:hover {
      background: linear-gradient(135deg, var(--gold) 0%, #eac07e 50%, var(--gold) 100%);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(182, 141, 74, 0.5);
    }

    /* ── PROGRAM ── */
    .program-list {
      list-style: none;
      position: relative;
      padding-left: 0;
    }
    .program-list::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      transform: translateX(-50%);
    }

    .program-list li {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
      position: relative;
    }
    .program-list li:nth-child(odd)  { flex-direction: row; }
    .program-list li:nth-child(even) { flex-direction: row-reverse; }

    .prog-time {
      flex: 1;
      text-align: right;
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 0.05em;
      color: var(--gold-text);
      font-weight: 600;
    }
    .program-list li:nth-child(even) .prog-time { text-align: left; }

    .prog-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--rose-bg-light);
      box-shadow:
